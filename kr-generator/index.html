<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="KR Generator" />
  <title>KR Generator</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      min-height: 100vh;
      padding: 2rem;
    }
    header {
      max-width: 800px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header a {
      color: #6666aa;
      text-decoration: none;
      font-size: 0.9rem;
    }
    header a:hover { color: #a78bfa; }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container { max-width: 800px; margin: 0 auto; }

    .api-key-section {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .api-key-section label { font-size: 0.85rem; color: #8888aa; white-space: nowrap; }
    .api-key-section input {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: #e0e0f0;
      font-size: 0.9rem;
    }
    .api-key-section input:focus { outline: none; border-color: #6366f1; }

    .input-section {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .input-section label {
      display: block;
      font-size: 0.85rem;
      color: #8888aa;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    textarea {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 1rem;
      color: #e0e0f0;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      min-height: 140px;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #6366f1; }
    textarea::placeholder { color: #444466; }

    .row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .field { flex: 1; min-width: 200px; }
    .field label {
      display: block;
      font-size: 0.85rem;
      color: #8888aa;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field input[type="text"], .field select {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      color: #e0e0f0;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .field input[type="text"]:focus, .field select:focus { outline: none; border-color: #6366f1; }

    button.generate-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.25rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    button.generate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    button.generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .results { display: none; margin-top: 1.5rem; }
    .results.visible { display: block; }

    .kr-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      position: relative;
    }

    .kr-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .kr-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f0f0ff;
      line-height: 1.5;
    }

    .metric-badge {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      background: #1a2a3a;
      color: #60a5fa;
    }

    .copy-btn {
      background: #12122a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      color: #a0a0cc;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .copy-btn:hover { border-color: #6366f1; color: #c0c0ff; }
    .copy-btn.copied { border-color: #5dbb8a; color: #5dbb8a; }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6666aa;
      margin-bottom: 0.4rem;
      margin-top: 1rem;
    }
    .section-title:first-of-type { margin-top: 0; }

    .rationale-text {
      font-size: 0.9rem;
      color: #a0a0cc;
      line-height: 1.55;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #6666aa;
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #2a2a4a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #2a1020;
      border: 1px solid #6b2040;
      border-radius: 10px;
      padding: 1rem;
      color: #f08090;
      font-size: 0.9rem;
    }

    .hint {
      font-size: 0.8rem;
      color: #555577;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html">← Back</a>
    <h1>🎯 KR Generator</h1>
  </header>

  <div class="container">
    <div class="api-key-section">
      <label for="apiKey">Anthropic API Key</label>
      <input type="password" id="apiKey" placeholder="sk-ant-..." />
    </div>

    <div class="input-section">
      <label for="descriptionInput">Describe what you're trying to achieve</label>
      <textarea id="descriptionInput" placeholder="e.g. I want our support team to respond to customer tickets faster and get better feedback scores this quarter. Right now it takes about 2 days to respond and our CSAT is around 78%."></textarea>

      <div class="row">
        <div class="field">
          <label for="objectiveInput">Objective (optional)</label>
          <input type="text" id="objectiveInput" placeholder="e.g. Delight our customers with world-class support" />
        </div>
        <div class="field">
          <label for="timeframeInput">Timeframe</label>
          <select id="timeframeInput">
            <option value="this quarter">This quarter</option>
            <option value="this month">This month</option>
            <option value="this half">This half (H1/H2)</option>
            <option value="this year">This year</option>
          </select>
        </div>
      </div>

      <button class="generate-btn" id="generateBtn" onclick="generateKRs()">Generate Key Results</button>
      <p class="hint">Tip: mention any numbers you already have (current state, target, deadline) — the more specific your input, the more measurable the KRs.</p>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    const savedKey = localStorage.getItem('anthropic_api_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;

    document.getElementById('apiKey').addEventListener('change', (e) => {
      localStorage.setItem('anthropic_api_key', e.target.value);
    });

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function copyKR(btn) {
      const text = btn.dataset.kr;
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1500);
      });
    }

    async function generateKRs() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const description = document.getElementById('descriptionInput').value.trim();
      const objective = document.getElementById('objectiveInput').value.trim();
      const timeframe = document.getElementById('timeframeInput').value;
      const resultsDiv = document.getElementById('results');
      const btn = document.getElementById('generateBtn');

      if (!apiKey) { alert('Please enter your Anthropic API key.'); return; }
      if (!description) { alert('Please describe what you want to achieve.'); return; }

      localStorage.setItem('anthropic_api_key', apiKey);

      btn.disabled = true;
      resultsDiv.className = 'results visible';
      resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div><br/>Turning that into measurable Key Results...</div>`;

      const systemPrompt = `You are an expert OKR coach. Turn a rough, free-text description of a goal or accomplishment into strong Key Results (KRs).

Rules for a good Key Result:
- Outcome-focused, not a task or activity ("Increase X from A to B" not "Launch X" or "Work on X").
- Measurable: includes a specific metric, and a baseline and/or target number wherever the input gives enough information to infer one reasonably. If no numbers are given, propose a sensible, clearly-labeled placeholder metric and say so in the rationale.
- Time-bound: reference the given timeframe.
- Ambitious but plausible — a stretch, not a guarantee.
- Written as a single clear sentence, no jargon, no fluff.

Generate exactly 3 distinct KR candidates that could each stand alone, offering different but reasonable ways to measure success for the same underlying goal (e.g. different metrics or angles), not 3 near-duplicates.

Respond with JSON in exactly this format:
{
  "krs": [
    {
      "kr": "the key result as a single sentence",
      "metric_type": "short label like Percentage, Count, Dollar Amount, Time/Duration, Score/Rating, Binary Milestone",
      "rationale": "1-2 sentences on why this is measurable and how it ties to the goal, noting any assumed numbers"
    }
  ]
}`;

      const userParts = [`Goal description: ${description}`];
      if (objective) userParts.push(`Objective this KR should ladder up to: ${objective}`);
      userParts.push(`Timeframe: ${timeframe}`);

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-opus-4-6',
            max_tokens: 1500,
            system: systemPrompt,
            messages: [{ role: 'user', content: userParts.join('\n') }]
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || `API error ${response.status}`);
        }

        const data = await response.json();
        const raw = data.content[0].text;
        const jsonMatch = raw.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('Unexpected response format');
        const result = JSON.parse(jsonMatch[0]);

        if (!result.krs || !result.krs.length) throw new Error('No Key Results returned');

        resultsDiv.innerHTML = result.krs.map((item, i) => `
          <div class="kr-card">
            <div class="kr-header">
              <span class="kr-text">${escapeHTML(item.kr)}</span>
              <span class="metric-badge">${escapeHTML(item.metric_type)}</span>
            </div>
            <div class="section-title">Why it works</div>
            <p class="rationale-text">${escapeHTML(item.rationale)}</p>
            <button class="copy-btn" data-kr="${escapeHTML(item.kr)}" onclick="copyKR(this)">Copy KR</button>
          </div>
        `).join('');
      } catch (err) {
        resultsDiv.innerHTML = `<div class="error-box">⚠️ ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('descriptionInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generateKRs();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
    }
  </script>
</body>
</html>
