name: FTC Press Release Monitor

on:
  schedule:
    - cron: '0 15 * * *'   # 10am EST (UTC-5, Nov–Mar)
    - cron: '0 14 * * *'   # 10am EDT (UTC-4, Mar–Nov)
  workflow_dispatch:        # allow manual runs from GitHub UI

concurrency:
  group: ftc-monitor
  cancel-in-progress: false  # let the current run finish; queue the next

jobs:
  check-press-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # needed to commit state file back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run FTC monitor
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check_ftc_pressreleases.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ftc_state.json ftc_log.txt
          git diff --staged --quiet || git commit -m "Update FTC state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD
