name: AG Press Release Monitor

on:
  schedule:
    - cron: '30 14 * * *'  # 9:30am EST (UTC-5, Nov–Mar)
    - cron: '30 13 * * *'  # 9:30am EDT (UTC-4, Mar–Nov)
  workflow_dispatch:

concurrency:
  group: ag-monitor
  cancel-in-progress: false

jobs:
  check-press-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run AG press release monitor
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check_ag_pressreleases.py

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push state
        run: |
          git add ag_state.json ag_log.txt
          git commit -m "Update AG state [skip ci]" || true
          git rebase origin/main
          git push
